name: Update Intraday Dashboard Data

# Paused: index.html does not use btc_1h_price.json / btc_4h_price.json yet, and rebuilding
# them twice a day added several MB to git history each time. Run it manually from the
# Actions tab, or restore a schedule once the dashboard reads these files.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-data-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # No secrets in this step: package install scripts never see the Kaggle key.
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Download Kaggle CSV
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d mczielinski/bitcoin-historical-data --unzip
          test -f btcusd_1-min_data.csv || { echo "Expected CSV not found"; exit 1; }

      - name: Generate intraday price JSON (1H/4H)
        run: python generate_intraday_price_json.py

      - name: Commit and push
        run: |
          git add btc_1h_price.json btc_4h_price.json
          scripts/push_with_retry.sh "chore: update intraday BTC price JSON [$(date -u +%Y-%m-%d)]"
