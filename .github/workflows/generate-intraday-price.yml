# .github/workflows/generate-intraday-price.yml
name: Generate Intraday BTC Price JSON

on:
  workflow_dispatch:      # manual trigger
  schedule:
    - cron: "15 0 * * *"  # daily at 00:15 UTC — adjust as needed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Generate 1H/4H JSON
        run: python generate_intraday_price_json.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add btc_1h_price.json btc_4h_price.json
          git diff --staged --quiet || git commit -m "Update intraday BTC price data"
          git push
