name: Update Intraday Dashboard Data

on:
  workflow_dispatch:  # Manual trigger: "Run workflow" button in GitHub Actions
  schedule:
    - cron: "37 23 * * *"  # 06:37 BKK (23:37 UTC the previous day)
    - cron: "37 8 * * *"   # 15:37 BKK (08:37 UTC)

permissions:
  contents: write  # needed so the job can push the updated JSON files

concurrency:
  group: update-intraday-data
  cancel-in-progress: false  # avoid two runs pushing at the same time

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas six kaggle
          python -c "import six; print('six', six.__version__)"

      - name: Download Kaggle CSV
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d mczielinski/bitcoin-historical-data --unzip
          ls -lh
          test -f btcusd_1-min_data.csv || { echo "Expected CSV not found"; exit 1; }
          ls -lh btcusd_1-min_data.csv

      - name: Generate intraday price JSON (1H/4H)
        run: python generate_intraday_price_json.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add btc_1h_price.json btc_4h_price.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update intraday BTC price JSON [$(date -u +%Y-%m-%d)]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
