name: Update Intraday Dashboard Data
on:
  workflow_dispatch:  # Manual trigger — "Run workflow" button in GitHub Actions
  schedule:
    - cron: "15 6 * * *"  # Auto-run daily at 06:15 UTC (15 min after the daily job)
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas kaggle
      - name: Download Kaggle CSV
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d mczielinski/bitcoin-historical-data --unzip
          ls -lh btcusd_1-min_data.csv
      - name: Generate intraday price JSON (1H/4H)
        run: python generate_intraday_price_json.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add btc_1h_price.json btc_4h_price.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: update intraday BTC price JSON [$(date -u +%Y-%m-%d)]"
          git push
