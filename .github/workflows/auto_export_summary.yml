name: Auto-Export MVRV Summary

on:
  schedule:
    - cron: "41 2 * * *"   # daily 02:41 UTC, after the price (00:17) and MVRV (01:23) updates
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-data-push
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # generate_summary.py uses the standard library only.
      - name: Generate summary export
        run: python generate_summary.py
        env:
          MVRV_PATH:  mvrv.json
          PRICE_PATH: btc_daily_price.json
          OUT_DIR:    exports

      - name: Commit and push
        run: |
          git add -A exports/
          scripts/push_with_retry.sh "chore: auto-export mvrv_summary_$(date -u +%Y-%m-%d).txt"
