name: Auto Export BTC Snapshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests numpy

      - name: Refresh BTC price data
        run: python generate_price_json.py
