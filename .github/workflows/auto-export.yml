name: Auto Export BTC Snapshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      
      - name: Refresh BTC price data
        run: python generate_price_json.py

      - name: Run export script
        run: python export_snapshot.py
      

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/latest_snapshot.txt
          git diff --cached --quiet || git commit -m "auto: snapshot $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
