name: Update BTC price

on:
  workflow_dispatch:
  schedule:
    - cron: "37 23 * * *"  # CHANGE: keep the cron line(s) from your current file

permissions:
  contents: write

concurrency:
  group: update-btc-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas six "kaggle==1.6.17"
          python -c "import six; print('six', six.__version__)"

      - name: Download Kaggle CSV
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d mczielinski/bitcoin-historical-data --unzip
          ls -lh
          test -f btcusd_1-min_data.csv || { echo "Expected CSV not found"; exit 1; }

      - name: Generate daily price JSON
        run: python generate_daily_price_json.py  # CHANGE: your actual script name

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add btc_daily_price.json  # CHANGE: your actual output file(s)
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily BTC price JSON [$(date -u +%Y-%m-%d)]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
