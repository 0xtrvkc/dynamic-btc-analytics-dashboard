name: Update BTC price

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Asia/Bangkok"  # daily 07:17 BKK (00:17 UTC)

permissions:
  contents: write

concurrency:
  group: repo-data-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # No secrets in this step: package install scripts never see the Kaggle key.
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Download Kaggle CSV
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d mczielinski/bitcoin-historical-data --unzip
          ls -lh btcusd_1-min_data.csv

      - name: Generate daily price JSON
        run: python generate_daily_price_json.py

      - name: Commit and push
        run: |
          git add btc_daily_price.json
          scripts/push_with_retry.sh "chore: update btc_daily_price.json [$(date -u +%Y-%m-%d)]"
