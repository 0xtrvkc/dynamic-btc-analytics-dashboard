name: Update MVRV Data

on:
  schedule:
    - cron: '23 1 * * *'   # daily 01:23 UTC (off the busy top of the hour)
  workflow_dispatch:

permissions:
  contents: write

# One group for every workflow that pushes data, so they never race each other.
concurrency:
  group: repo-data-push
  cancel-in-progress: false

jobs:
  update-mvrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install Playwright + Chromium (pinned)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.65.1
          npx playwright install chromium --with-deps

      - name: Scrape, validate against the current file, and save mvrv.json
        run: node scripts/update_mvrv.js

      - name: Commit and push if data changed
        run: |
          git add mvrv.json
          LATEST=$(node -e "const d=require('./mvrv.json');const l=d.mvrv.at(-1);console.log(new Date(l.x).toISOString().slice(0,10)+' (MVRV: '+l.y.toFixed(4)+')')")
          scripts/push_with_retry.sh "chore: update mvrv.json — ${LATEST}"
